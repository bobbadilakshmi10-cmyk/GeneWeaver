
<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Define character encoding -->
    <meta charset="UTF-8">

    <!-- Make webpage responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Browser tab title -->
    <title>GeneWeaver: GPU-Accelerated CRISPR Alignment Engine</title>

    <!-- Browser tab icon -->
    <link rel="icon" type="image/jpeg"
          href="{{ url_for('static', filename='images.jpg') }}">

    <!-- CSS styling -->
    <style>

        /* Overall webpage styling */
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 30px auto;
            padding: 20px;
            background: #1ed418;
            color: #243247;
        }

        /* Main heading */
        h1 {
            color: #c91426;
        }

        /* Form and results panels */
        .panel {
            background: white;
            padding: 24px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px #00000010;
        }

        /* Label styling */
        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        /* Input and button spacing */
        input, button {
            margin-top: 8px;
            padding: 10px;
            box-sizing: border-box;
        }

        /* Full-width input fields */
        input[type="text"],
        input[type="number"],
        input[type="file"] {
            width: 100%;
        }

        /* Scan button styling */
        button {
            background: #176b56;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            padding: 12px 20px;
        }

        /* Disabled button styling */
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Status message */
        #message {
            margin-top: 15px;
            overflow-wrap: anywhere;
        }

        /* Responsive table container */
        .table-container {
            overflow-x: auto;
        }

        /* Results table */
        table {
            border-collapse: collapse;
            width: 100%;
            background: white;
        }

        /* Table cells */
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }

        /* Table header */
        th {
            background: #176b56;
            color: white;
        }

    </style>
</head>

<body>

    <!-- Project heading -->
    <center>
        <h1>GeneWeaver: GPU-Accelerated CRISPR Alignment Engine</h1>
    </center>

    <!-- Project introduction -->
    <marquee behavior="scroll" direction="right" scrollamount="4">
        <p>Upload a FASTA file and scan for target DNA matches.</p>
    </marquee>

    <!-- DNA scanning form panel -->
    <div class="panel">

        <form id="scanForm">

            <!-- Target DNA input -->
            <label for="target">Target DNA Sequence</label>
            <input id="target" name="target"
                   type="text" value="ACGT" required>

            <!-- FASTA file upload -->
            <label for="fasta_file">Upload FASTA File</label>
            <input id="fasta_file" name="fasta_file"
                   type="file" accept=".fa,.fasta,.fna" required>

            <!-- Maximum allowed mismatches -->
            <label for="max_mismatches">Maximum Mismatches</label>
            <input id="max_mismatches" name="max_mismatches"
                   type="number" value="3" min="0" required>

            <!-- DNA scanning step -->
            <label for="step">Scan Step</label>
            <input id="step" name="step"
                   type="number" value="1" min="1" required>

            <!-- Submit scan form -->
            <button type="submit" id="scanButton">
                Scan DNA
            </button>

        </form>

        <!-- Display status and error messages -->
        <p id="message" role="status"></p>

    </div>

    <!-- DNA results panel -->
    <div class="panel">

        <h2>Scan Results</h2>

        <!-- Display scan summary -->
        <p id="summary">Upload a FASTA file to begin.</p>

        <!-- Results table -->
        <div class="table-container">

            <table id="resultsTable">

                <!-- JavaScript creates headings -->
                <thead></thead>

                <!-- JavaScript displays DNA results -->
                <tbody></tbody>

            </table>

        </div>

    </div>

    <!-- JavaScript functionality -->
    <script>

        // Get HTML elements
        const form = document.getElementById("scanForm");
        const message = document.getElementById("message");
        const summary = document.getElementById("summary");
        const button = document.getElementById("scanButton");

        const tableHead =
            document.querySelector("#resultsTable thead");

        const tableBody =
            document.querySelector("#resultsTable tbody");

        // Handle form submission
        form.addEventListener("submit", async function(event) {

            // Prevent page reload
            event.preventDefault();

            // Display scanning message
            message.textContent = "Scanning DNA. Please wait...";

            // Clear previous results
            summary.textContent = "";
            tableHead.replaceChildren();
            tableBody.replaceChildren();

            // Disable button during scanning
            button.disabled = true;

            try {

                // Collect form data
                const formData = new FormData(form);

                // Send data to Flask backend
                const response = await fetch("/api/analyze", {
                    method: "POST",
                    body: formData
                });

                // Convert response into JSON
                const data = await response.json();

                // Check backend errors
                if (!response.ok) {
                    throw new Error(
                        data.error || "DNA scan failed."
                    );
                }

                // Display backend message
                message.textContent = data.message;

                // Display scan summary
                summary.textContent =
                    "Sequences scanned: " + data.sequence_count +
                    " | Total matches: " + data.results_count;

                // Check whether results exist
                if (!data.results || data.results.length === 0) {

                    const row = document.createElement("tr");
                    const cell = document.createElement("td");

                    cell.textContent =
                        "No matching DNA regions found.";

                    row.appendChild(cell);
                    tableBody.appendChild(row);

                    return;
                }

                // Get column names from first result
                const columns = Object.keys(data.results[0]);

                // Create table header row
                const headerRow = document.createElement("tr");

                // Create each table heading
                columns.forEach(function(column) {

                    const th = document.createElement("th");

                    th.textContent = column;

                    headerRow.appendChild(th);

                });

                // Add header to table
                tableHead.appendChild(headerRow);

                // Display every DNA matching result
                data.results.forEach(function(result) {

                    const row = document.createElement("tr");

                    // Create cells for each result column
                    columns.forEach(function(column) {

                        const cell = document.createElement("td");

                        const value = result[column];

                        // Convert result values into text
                        cell.textContent =
                            value === null || value === undefined
                                ? ""
                                : typeof value === "object"
                                    ? JSON.stringify(value)
                                    : String(value);

                        row.appendChild(cell);

                    });

                    // Add completed row to table
                    tableBody.appendChild(row);

                });

                // Inform user when results are limited
                if (data.results_count > data.results.length) {

                    message.textContent +=
                        " Showing the first " +
                        data.results.length + " results.";

                }

            } catch(error) {

                // Display error message
                message.textContent = "Error: " + error.message;

            } finally {

                // Enable button after scanning
                button.disabled = false;

            }

        });

    </script>

</body>
</html>
