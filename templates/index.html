
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GeneWeaver: GPU-Accelerated CRISPR Alignment Engine</title>

    <link rel="icon" type="image/jpeg"
          href="{{ url_for('static', filename='images.jpg') }}">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        /* General page styling */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #071c2c, #123e50, #087f70);
            color: #ffffff;
            min-height: 100vh;
            padding: 35px 15px;
        }

        /* Main container */
        .container {
            max-width: 1050px;
        }

        /* Header section */
        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 36px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 1px;
            margin-bottom: 12px;
            text-shadow: 0 3px 12px #00000050;
        }

        .header h1 span {
            color: #46e6b2;
        }

        .header p {
            color: #c6e9e5;
            font-size: 16px;
        }

        /* Animated introduction */
        .marquee-box {
            overflow: hidden;
            white-space: nowrap;
            background: #ffffff15;
            border: 1px solid #ffffff30;
            border-radius: 10px;
            padding: 13px;
            margin-bottom: 25px;
        }

        .marquee-text {
            display: inline-block;
            color: #75f5ca;
            font-size: 15px;
            font-weight: 600;
            padding-left: 100%;
            animation: scrolling 18s linear infinite;
        }

        @keyframes scrolling {
            from {
                transform: translateX(0);
            }

            to {
                transform: translateX(-100%);
            }
        }

        /* Main panels */
        .panel {
            background: #ffffff;
            color: #263746;
            padding: 30px;
            border-radius: 18px;
            margin-bottom: 25px;
            box-shadow: 0 12px 35px #00000030;
            transition: transform 0.3s ease;
        }

        .panel:hover {
            transform: translateY(-3px);
        }

        /* Panel headings */
        .panel h2 {
            color: #087f70;
            font-size: 23px;
            font-weight: 750;
            margin-bottom: 22px;
            border-bottom: 2px solid #e0f2ed;
            padding-bottom: 12px;
        }

        /* Form labels */
        label {
            display: block;
            font-weight: 650;
            margin-bottom: 9px;
            margin-top: 18px;
            color: #263746;
        }

        /* Input fields */
        input[type="text"],
        input[type="number"],
        input[type="file"] {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccd9df;
            border-radius: 9px;
            background: #f8fbfc;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: #07977d;
            box-shadow: 0 0 0 4px #07977d20;
            background: #ffffff;
        }

        input[type="file"] {
            cursor: pointer;
        }

        input[type="file"]::file-selector-button {
            background: #e0f5ef;
            color: #087f70;
            border: none;
            padding: 9px 14px;
            border-radius: 6px;
            font-weight: 600;
            margin-right: 12px;
            cursor: pointer;
        }

        /* Scan button */
        button {
            width: 100%;
            margin-top: 28px;
            padding: 14px;
            background: linear-gradient(135deg, #087f70, #12ad88);
            color: #ffffff;
            font-size: 17px;
            font-weight: 700;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover:not(:disabled) {
            background: linear-gradient(135deg, #06685c, #079b77);
            transform: translateY(-2px);
            box-shadow: 0 7px 18px #087f7040;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Status messages */
        #message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            overflow-wrap: anywhere;
            color: #087f70;
        }

        /* Results summary */
        #summary {
            background: #e8f7f2;
            color: #087f70;
            padding: 14px;
            border-radius: 9px;
            font-weight: 650;
            margin-bottom: 20px;
            overflow-wrap: anywhere;
        }

        /* Results table container */
        .table-container {
            width: 100%;
            overflow-x: auto;
            border-radius: 10px;
        }

        /* Results table */
        table {
            width: 100%;
            border-collapse: collapse;
            background: #ffffff;
            min-width: 500px;
        }

        th, td {
            padding: 13px;
            border: 1px solid #e0e7eb;
            text-align: left;
            font-size: 14px;
        }

        th {
            background: #087f70;
            color: #ffffff;
            text-transform: capitalize;
            font-weight: 700;
        }

        tbody tr:nth-child(even) {
            background: #f0faf7;
        }

        tbody tr:hover {
            background: #dff5ed;
        }

        /* Footer */
        .footer {
            text-align: center;
            color: #c6e9e5;
            font-size: 13px;
            margin-top: 25px;
        }

        /* Responsive design */
        @media (max-width: 768px) {

            body {
                padding: 20px 10px;
            }

            .header h1 {
                font-size: 25px;
            }

            .panel {
                padding: 20px;
            }

            .panel h2 {
                font-size: 20px;
            }

            .marquee-text {
                font-size: 13px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }

    </style>
</head>

<body>

    <div class="container">

        <!-- Project Header -->
        <div class="header">

            <h1>
                🧬 Gene<span>Weaver</span>
            </h1>

            <p>
                GPU-Accelerated CRISPR Alignment Engine
            </p>

        </div>

        <!-- Scrolling Introduction -->
        <div class="marquee-box">

            <div class="marquee-text">
                Upload your FASTA file and scan DNA sequences
                to identify target matches using GeneWeaver.
            </div>

        </div>

        <!-- DNA Scanning Form -->
        <div class="panel">

            <h2>🧪 DNA Sequence Analysis</h2>

            <form id="scanForm">

                <!-- Target DNA -->
                <label for="target">
                    Target DNA Sequence
                </label>

                <input
                    id="target"
                    name="target"
                    type="text"
                    value="ACGT"
                    placeholder="Enter target DNA sequence"
                    required
                >

                <!-- FASTA Upload -->
                <label for="fasta_file">
                    📁 Upload FASTA File
                </label>

                <input
                    id="fasta_file"
                    name="fasta_file"
                    type="file"
                    accept=".fa,.fasta,.fna"
                    required
                >

                <!-- Maximum Mismatches -->
                <label for="max_mismatches">
                    Maximum Mismatches
                </label>

                <input
                    id="max_mismatches"
                    name="max_mismatches"
                    type="number"
                    value="3"
                    min="0"
                    required
                >

                <!-- Scan Step -->
                <label for="step">
                    Scan Step
                </label>

                <input
                    id="step"
                    name="step"
                    type="number"
                    value="1"
                    min="1"
                    required
                >

                <!-- Scan Button -->
                <button type="submit" id="scanButton">
                    🔍 Scan DNA
                </button>

            </form>

            <!-- Status Message -->
            <p id="message" role="status" aria-live="polite"></p>

        </div>

        <!-- Results Panel -->
        <div class="panel">

            <h2>📊 Scan Results</h2>

            <!-- Results Summary -->
            <p id="summary">
                Upload a FASTA file to begin DNA analysis.
            </p>

            <!-- Results Table -->
            <div class="table-container">

                <table id="resultsTable">

                    <thead></thead>

                    <tbody></tbody>

                </table>

            </div>

        </div>

        <!-- Footer -->
        <div class="footer">

            <p>
                © 2026 GeneWeaver |
                GPU-Accelerated CRISPR Alignment Engine
            </p>

        </div>

    </div>


    <!-- JavaScript -->
    <script>

        // Get HTML elements
        const form = document.getElementById("scanForm");

        const message = document.getElementById("message");

        const summary = document.getElementById("summary");

        const button = document.getElementById("scanButton");

        const tableHead =
            document.querySelector("#resultsTable thead");

        const tableBody =
            document.querySelector("#resultsTable tbody");


        // Handle form submission
        form.addEventListener("submit", async function(event) {

            // Prevent page reload
            event.preventDefault();

            // Show scanning message
            message.textContent = "Scanning DNA. Please wait...";

            summary.textContent = "Processing DNA sequences...";

            // Clear previous results
            tableHead.replaceChildren();

            tableBody.replaceChildren();

            // Disable button
            button.disabled = true;

            button.textContent = "⏳ Scanning...";


            try {

                // Collect form data
                const formData = new FormData(form);

                // Send data to Flask backend
                const response = await fetch("/api/analyze", {

                    method: "POST",

                    body: formData

                });

                // Convert response to JSON
                const data = await response.json();

                // Check for backend errors
                if (!response.ok) {

                    throw new Error(
                        data.error || "DNA scan failed."
                    );

                }

                // Display success message
                message.textContent = data.message;

                // Display summary
                summary.textContent =
                    "Sequences scanned: " + data.sequence_count +
                    " | Total matches: " + data.results_count;


                // Check for empty results
                if (!data.results || data.results.length === 0) {

                    const row = document.createElement("tr");

                    const cell = document.createElement("td");

                    cell.textContent =
                        "No matching DNA regions found.";

                    cell.colSpan = 1;

                    row.appendChild(cell);

                    tableBody.appendChild(row);

                    return;

                }


                // Get column names
                const columns = Object.keys(data.results[0]);

                // Create table heading
                const headerRow = document.createElement("tr");

                columns.forEach(function(column) {

                    const th = document.createElement("th");

                    th.textContent = column;

                    headerRow.appendChild(th);

                });

                tableHead.appendChild(headerRow);


                // Display DNA results
                data.results.forEach(function(result) {

                    const row = document.createElement("tr");

                    columns.forEach(function(column) {

                        const cell = document.createElement("td");

                        const value = result[column];

                        cell.textContent =
                            value === null || value === undefined
                                ? ""
                                : typeof value === "object"
                                    ? JSON.stringify(value)
                                    : String(value);

                        row.appendChild(cell);

                    });

                    tableBody.appendChild(row);

                });


                // Display additional results information
                if (data.results_count > data.results.length) {

                    message.textContent +=
                        " Showing the first " +
                        data.results.length + " results.";

                }


            } catch(error) {

                // Display error
                message.textContent =
                    "Error: " + error.message;

                summary.textContent =
                    "DNA analysis could not be completed.";

            } finally {

                // Enable button again
                button.disabled = false;

                button.textContent = "🔍 Scan DNA";

            }

        });

    </script>

</body>
</html>
