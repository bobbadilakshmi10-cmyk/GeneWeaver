
<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Define character encoding -->
    <meta charset="UTF-8">

    <!-- Make the webpage responsive on different devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Set the browser tab title -->
    <title>"GeneWeaver": GPU-Accelerated CRISPR Alignment Engine </title>
    

<!-- Browser tab icon -->
<link rel="icon" type="images.jpg"
      href="{{ url_for('static', filename='images.jpg') }}">

    <!-- CSS styles for the webpage -->
    <style>
        /* Set the overall page layout and appearance */
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 30px auto;
            padding: 20px;
            background: blue;
            color: #243247;
        }

        /* Style the main heading */
        h1 {
            color: #c91426;
        }

        /* Style the form and results panels */
        .panel {
            background: white;
            padding: 24px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px #00000010;
        }

        /* Display labels on separate lines */
        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        /* Add spacing inside input fields and buttons */
        input, button {
            margin-top: 8px;
            padding: 10px;
            box-sizing: border-box;
        }

        /* Make text, number, and file inputs full width */
        input[type="text"],
        input[type="number"],
        input[type="file"] {
            width: 100%;
        }

        /* Style the scan button */
        button {
            background: #176b56;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            padding: 12px 20px;
        }

        /* Keep long status messages within the page */
        #message {
            margin-top: 15px;
            overflow-wrap: anywhere;
        }

        /* Allow horizontal scrolling for wide tables */
        .table-container {
            overflow-x: auto;
        }

        /* Set the table width and remove gaps between borders */
        table {
            border-collapse: collapse;
            width: 100%;
            background: white;
        }

        /* Style table headings and data cells */
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }

        /* Highlight the table header row */
        th {
            background: #176b56;
            color: white;
        }
    </style>
</head>

<body>
    <!-- Display the project title and introduction -->
    <center><h1>"GeneWeaver": GPU-Accelerated CRISPR Alignment Engine </h1></center>
    <marquee behavior="scroll" direction="right" scrollamount="4">
    <p>Upload a FASTA file and scan for target DNA matches.</p>
</marquee>

    <!-- Panel containing the DNA scanning form -->
    <div class="panel">

        <!-- Collect the target sequence and scanning settings -->
        <form id="scanForm">

            <!-- Input field for the target DNA sequence -->
            <label for="target">Target DNA sequence</label>
            <input id="target" name="target" type="text"
                   value="ACGT" required>

            <!-- Allow the user to upload a FASTA file -->
            <label for="fasta_file">Upload FASTA file</label>
            <input id="fasta_file" name="fasta_file"
                   type="file" accept=".fa,.fasta,.fna" required>

            <!-- Set the maximum number of allowed mismatches -->
            <label for="max_mismatches">Maximum mismatches</label>
            <input id="max_mismatches" name="max_mismatches"
                   type="number" value="3" min="0" required>

            <!-- Set the step between consecutive scan positions -->
            <label for="step">Scan step</label>
            <input id="step" name="step"
                   type="number" value="1" min="1" required>

            <!-- Submit the form to start DNA scanning -->
            <button type="submit" id="scanButton">Scan DNA</button>
        </form>

        <!-- Display success messages, errors, and scan status -->
        <p id="message" role="status"></p>
    </div>

    <!-- Panel displaying the DNA analysis results -->
    <div class="panel">
        <h2>Scan Results</h2>

        <!-- Display the number of sequences and matches -->
        <p id="summary">Upload a FASTA file to begin.</p>

        <!-- Make the results table scrollable on small screens -->
        <div class="table-container">

            <!-- JavaScript dynamically adds table headings and results -->
            <table id="resultsTable">
                <thead></thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <!-- JavaScript handles form submission and displays scan results -->
    <script>
        // Get references to the HTML elements
        const form = document.getElementById("scanForm");
        const message = document.getElementById("message");
        const summary = document.getElementById("summary");
        const button = document.getElementById("scanButton");
        const tableHead = document.querySelector("#resultsTable thead");
        const tableBody = document.querySelector("#resultsTable tbody");

        // Run this function when the user submits the form
        form.addEventListener("submit", async function (event) {

            // Prevent the browser from reloading the page
            event.preventDefault();

            // Display a scanning message
            message.textContent = "Scanning DNA. Please wait...";

            // Clear the previous summary and table results
            summary.textContent = "";
            tableHead.replaceChildren();
            tableBody.replaceChildren();

            // Disable the button to prevent repeated submissions
            button.disabled = true;

            try {
                // Collect all form values, including the uploaded file
                const formData = new FormData(form);

                // Send the form data to the Flask backend API
                const response = await fetch("/api/analyze", {
                    method: "POST",
                    body: formData
                });

                // Convert the server response into a JavaScript object
                const data = await response.json();

                // Handle errors returned by the backend
                if (!response.ok) {
                    throw new Error(data.error || "DNA scan failed.");
                }

                // Display the message returned by the server
                message.textContent = data.message;

                // Display the number of sequences scanned and matches found
                summary.textContent =
                    "Sequences scanned: " + data.sequence_count +
                    " | Total matches: " + data.results_count;

                // Display a message if no matching regions were found
                if (!data.results || data.results.length === 0) {
                    tableBody.innerHTML =
                        '<tr><td>No matching DNA regions found.</td></tr>';
                    return;
                }

                // Get the column names from the first result object
                const columns = Object.keys(data.results[0]);

                // Create a new table header row
                const headerRow = document.createElement("tr");

                // Create a heading cell for each result column
                columns.forEach(function (column) {
                    const th = document.createElement("th");

                    // Set the column name as the heading text
                    th.textContent = column;

                    // Add the heading to the row
                    headerRow.appendChild(th);
                });

                // Add the header row to the table
                tableHead.appendChild(headerRow);

                // Process each DNA match returned by the backend
                data.results.forEach(function (result) {
                    // Create a new table row
                    const row = document.createElement("tr");

                    // Add each result value to its corresponding cell
                    columns.forEach(function (column) {
                        const cell = document.createElement("td");
                        const value = result[column];

                        // Convert the value into safe displayable text
                        cell.textContent =
                            value === null || value === undefined
                                ? ""
                                : typeof value === "object"
                                    ? JSON.stringify(value)
                                    : String(value);

                        // Add the cell to the current row
                        row.appendChild(cell);
                    });

                    // Add the completed row to the results table
                    tableBody.appendChild(row);
                });

                // Inform the user if only some of the matches are displayed
                if (data.results_count > data.results.length) {
                    message.textContent +=
                        " Showing the first " + data.results.length +
                        " results.";
                }

            } catch (error) {
                // Display an error if the request or processing fails
                message.textContent = "Error: " + error.message;

            } finally {
                // Re-enable the scan button after processing finishes
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
